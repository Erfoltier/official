{"@context": "https://schema.org", "@graph": [{"@type": "MedicalWebPage", "name": "埼玉・大宮のタトゥー除去｜刺青・入れ墨除去もピコレーザーで｜いしだ皮フ科・美容皮膚科", "dateModified": "2026-10-31", "lastReviewed": "2026-10-31", "about": {"@type": "MedicalProcedure", "name": "ピコレーザーによるタトゥー除去", "alternateName": ["刺青除去", "入れ墨除去"], "procedureType": "https://schema.org/NoninvasiveProcedure", "howPerformed": "ディスカバリーピコプラス（532nm・694nm・1064nm）を用い、インクの色・濃さ・深さに合わせて波長と照射方法を選んで照射します。6〜8週間以上の間隔で複数回照射します。"}, "provider": {"@type": "MedicalClinic", "name": "いしだ皮フ科・美容皮膚科", "foundingDate": "1991", "url": "https://ishidahihuka.jp/", "telephone": "048-687-4112", "address": {"@type": "PostalAddress", "addressRegion": "埼玉県", "addressLocality": "さいたま市見沼区", "streetAddress": "東大宮5-41-1", "postalCode": "337-0051", "addressCountry": "JP"}, "medicalSpecialty": "Dermatology"}}, {"@type": "FAQPage", "mainEntity": [{"@type": "Question", "name": "タトゥー（刺青・入れ墨）は1回で消えますか？", "acceptedAnswer": {"@type": "Answer", "text": "1回で消えることはほとんどありません。照射を重ねるごとに少しずつ薄くなり、プロが彫った黒一色のタトゥーでも5〜10回以上かかるのが一般的です。"}}, {"@type": "Question", "name": "カラーのタトゥーは料金が高くなりますか？", "acceptedAnswer": {"@type": "Answer", "text": "いいえ。黒一色でもカラーでも同じ料金で、面積だけで決まります。1回29,700円（〜5cm²、税込）からです。"}}, {"@type": "Question", "name": "眉などのアートメイクも除去できますか？", "acceptedAnswer": {"@type": "Answer", "text": "診察で色と部位を確認したうえで照射します。アートメイクの色素は照射で黒っぽく変化することがあるため、小さな範囲で反応を確認してから進めます。アイラインなど目のすぐ近くは照射できません。詳しくはアートメイク除去のページをご覧ください。"}}, {"@type": "Question", "name": "和彫りなど広い範囲の入れ墨（刺青）も除去できますか？", "acceptedAnswer": {"@type": "Answer", "text": "照射できます。料金は入れ墨をすべて含む長方形の面積で決まり、50cm²を超えた分は10cm²あたり11,000円を加算します（例：はがきほどの150cm²で169,400円）。手彫りや墨が深く入っている場合は、照射の回数が多くなる傾向があります。"}}, {"@type": "Question", "name": "何回で終わるか、治療前にわかりますか？", "acceptedAnswer": {"@type": "Answer", "text": "治療前に回数をお伝えすることはできません。必要な回数は、皮膚に入っているインクの量や深さによって大きく変わり、外から見ただけでは判断できないためです。照射ごとの反応と経過を診察で確認しながら進めます。"}}, {"@type": "Question", "name": "痛みはどのくらいですか？", "acceptedAnswer": {"@type": "Answer", "text": "輪ゴムで強くはじかれるような痛みと表現される方が多いです。レーザーの痛みに対しては麻酔クリームは麻酔注射より効きが弱いため、当院ではタトゥー除去の麻酔はクリームを使用せず、極細の針による局所麻酔注射で行っています（1ccあたり5,500円、税込）。"}}, {"@type": "Question", "name": "タトゥー除去は何曜日に受けられますか？", "acceptedAnswer": {"@type": "Answer", "text": "タトゥー除去は日曜日限定の診療です。シミ取りや注入治療など他の美容皮膚科メニュー（水曜・祝日）とは診療日が異なりますので、ご予約の際はご注意ください。"}}, {"@type": "Question", "name": "予約のときに何を伝えればよいですか？", "acceptedAnswer": {"@type": "Answer", "text": "LINEの予約申請フォームに、希望照射面積をご入力ください。タトゥーをすべて含めることのできる長方形を考え、その長辺×短辺（例：4cm×6cm＝24cm²）で測ります。面積によって確保する診療時間が異なるためです。部位と色（黒のみ／カラーあり）もあわせてお知らせください。"}}, {"@type": "Question", "name": "大宮駅から通えますか？", "acceptedAnswer": {"@type": "Answer", "text": "当院はJR宇都宮線（上野東京ライン・湘南新宿ライン）の東大宮駅東口から徒歩1分です。大宮駅から2駅で、さいたま市内や埼玉県内から通いやすい場所です。"}}, {"@type": "Question", "name": "照射した当日にシャワーを浴びられますか？", "acceptedAnswer": {"@type": "Answer", "text": "シャワーは当日から浴びられます。患部はこすらず、湯船につかるのは医師の指示があるまでお控えください。"}}]}]}
