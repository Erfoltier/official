<!doctype html>
<html lang="ja">
  <head>
    <meta charset="utf-8" />
    <title>LANE RESERVE デジカル写し</title>
    <style>
      body { font: 13px/1.6 system-ui, sans-serif; width: 300px; margin: 12px; color: #222; }
      h1 { font-size: 14px; margin: 0 0 8px; }
      label { display: block; margin: 8px 0 2px; }
      input[type="text"] { width: 100%; box-sizing: border-box; padding: 4px 6px; }
      .row { display: flex; align-items: center; gap: 8px; margin: 8px 0; }
      #status { background: #f4f4f0; border-radius: 6px; padding: 8px; margin: 8px 0; white-space: pre-wrap; }
      button { padding: 4px 10px; }
      small { color: #666; }
    </style>
  </head>
  <body>
    <h1>LANE RESERVE デジカル写し</h1>
    <div class="row"><input type="checkbox" id="enabled" /><label for="enabled" style="margin: 0">このパソコンで写す（ON）</label></div>
    <label for="label">このパソコンの名前</label>
    <input type="text" id="label" maxlength="40" placeholder="受付PC など" />
    <div id="status">—</div>
    <div class="row"><button id="run">今すぐ写す</button><small>LANE RESERVE とデジカルにログインしておいてください</small></div>
    <script src="popup.js"></script>
  </body>
</html>
